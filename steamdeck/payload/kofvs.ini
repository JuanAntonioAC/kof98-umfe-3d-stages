# KOF VS Controller Selector - configuracion
# Las claves sin seccion o en [global] valen para todo. [kof2002], [kof98] y [proto] solo para ese juego.

# enabled=0 desactiva el mod por completo: la DLL no instala ningun hook.
enabled=1

# Tiempo que se muestra LOCKED antes de devolver el control al juego (ms).
lock_delay_ms=900
# La pantalla se muestra siempre antes de la seleccion de personajes (Arcade, VS, Practice, Endless, etc.).
# always_show=1 se conserva por compatibilidad; ya no hace falta para ver layouts con 2 mandos.
always_show=1
# 1 = si tras F10 (entrada normal) se conecta un mando extra, se vuelve a pedir seleccion.
reselect_on_new_device=1

# Botones: tras activar el control aparece SELECT YOUR BUTTON LAYOUT. ARRIBA/ABAJO recorre 6 perfiles.
# 1 humano local = 1 panel (sin elegida de lado). 2 humanos locales = 2 paneles (LEFT/RIGHT = P1/P2).
# classic    = [A][C][-][-] / [B][D][-][-]  (la del juego)
# san_felipe = [A][B][C][-] / [D][-][-][-]
# lineal     = [A][B][C][D] / [-][-][-][-]
# pulgar     = [B][C][D][-] / [A][-][-][-]
# abcd       = [A][B][-][-] / [C][D][-][-]
# mexico     = [A][B][C][-] / [-][-][D][-]
# El ultimo perfil por VID:PID se guarda en kofvs-layouts.ini (junto a esta carpeta al jugar).
# Con solo 2 controles la pantalla no aparece: pon always_show=1 para poder elegir un perfil.
default_layout=classic

# Lectura de dispositivos.
use_dinput=1
xinput_caps=1
deadzone=8000
# 1 = leer los mandos Xbox por DirectInput (permite mas de 4, pero LT/RT comparten eje).
xbox_via_dinput=0
# Steam Input: off | auto (oculta Sony/Nintendo/Valve en DirectInput si hay un mando virtual de Steam) | all
steam_dedupe=auto

# Botones DirectInput (mandos que no son XInput, p. ej. un HORI en modo PS4/PS5 sin Steam Input).
# Cada boton se traduce a la POSICION fisica equivalente de un mando Xbox. Orden HID de PlayStation,
# el mismo que usan las tablas DirectInput por defecto de ambos juegos (2002 0x1407CE210, '98 0x14053BBE0):
# 0=CUADRADO 1=CRUZ 2=CIRCULO 3=TRIANGULO 4=L1 5=R1 6=L2 7=R2 8=SHARE/CREATE 9=OPTIONS 10=L3 11=R3
# Nombres validos: X Y A B LB RB LT RT BACK START LS RS UP DOWN LEFT RIGHT NONE
# (o SQUARE TRIANGLE CROSS CIRCLE L1 R1 L2 R2 SELECT SHARE OPTIONS L3 R3).
di_button_0=X
di_button_1=A
di_button_2=B
di_button_3=Y
di_button_4=LB
di_button_5=RB
di_button_6=LT
di_button_7=RT
di_button_8=BACK
di_button_9=START
di_button_10=LS
di_button_11=RS
# Si un mando concreto usa otro orden, se le da un perfil propio por VID:PID (hex), botones 0,1,2... en orden.
# Mira las lineas "INPUT CONTROL n ... DI buttons=" del log para saber que indice manda cada boton. Ejemplo:
# di_map_0F0D_01FA=SQUARE CROSS CIRCLE TRIANGLE L1 R1 L2 R2 SHARE OPTIONS L3 R3

# 1 = el teclado no llega al juego mientras el selector esta activo (seleccion y combate VS).
block_keyboard=1
# CTRL+SHIFT+F9 repetir seleccion, CTRL+SHIFT+F10 entrada normal hasta el siguiente enfrentamiento.
hotkeys=1
# 1 = registrar aperturas de BGM y estadisticas cada 10 s en kofvs.log.
diagnostics=1
# 1 = registrar cada pulsacion: indice DirectInput, posicion fisica y accion que recibe el juego.
# Util para comprobar mandos nuevos; pon 0 cuando todo funcione (el log crece rapido).
log_buttons=1
# Si el overlay no presenta frames durante este tiempo mientras bloquea la entrada, se libera (ms). 0 = nunca.
failsafe_ms=5000

[kof2002]
# Pista que el juego abre en la seleccion de personajes (banda arrange). Evidencia: log real del mod BGM.
select_bgm=UM48000Hz/BGM03.

[kof98]
# Pista de la seleccion de personajes. Evidencia: partida real del 17-10-2026 (PS_N al entrar en VS y tras WIN_N).
# Se ancla a "bgm/" para no confundirla con R_PS_N.ogg.
select_bgm=bgm/PS_N.
# SELECT y START solo salen de los botones fisicos SELECT/BACK/SHARE y START/OPTIONS/MENU.
# 0 (por defecto) = L1 no manda SELECT. 1 = comportamiento anterior (L1/LB tambien manda SELECT en SAN FELIPE).
san_felipe_l1_select=0

[kof13]
# KOF XIII no reescribe la configuracion de botones del juego.
# Los seis perfiles se aplican sobre la entrada, encima del diamante de fabrica (X=LP A=LK Y=HP B=HK).
# Deja esa asignacion en el menu del juego. L1 no es SELECT.
san_felipe_l1_select=0
# Si en el juego A/B/C/D no estan en X/A/Y/B, indica aqui que boton del mando usa el juego para
# A(LP), B(LK), C(HP) y D(HK), en ese orden. Prueba en ENTRENAMIENTO con CLASICA y la vista de comandos.
# Nombres: X Y A B (o SQUARE TRIANGLE CROSS CIRCLE), tambien LB RB. Sin la linea = fabrica X,A,Y,B.
# Solo afecta a SAN FELIPE, LINEAL, PULGAR, AB/CD y MEXICO; CLASICA sigue siendo la del juego.
# game_buttons=X,A,Y,B

[proto]
diagnostics=1
